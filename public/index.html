<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{margin:0;overflow:hidden;background:#000;font-family:Arial}
.bg{
  position:fixed;inset:0;
  background:url('https://images.pexels.com/videos/2169880/2169880-hd_1920_1080_30fps.mp4') center/cover;
  background-image:url('./mountain.jpg'); /* usa la que te generé */
  animation: zoom 25s infinite alternate ease-in-out;
  filter: brightness(0.7);
}
@keyframes zoom{
  0%{transform:scale(1) translateY(0)}
  100%{transform:scale(1.15) translateY(-20px)}
}
.login{
  position:relative;z-index:2;
  height:100vh;display:flex;align-items:center;justify-content:center;
}
.box{
  background:rgba(0,0,0,0.6);backdrop-filter:blur(10px);
  padding:30px;border-radius:15px;width:300px;text-align:center
}
input{width:100%;padding:12px;margin:8px 0;border-radius:8px;border:none;outline:none}
button{width:100%;padding:12px;border:none;border-radius:8px;background:white;color:black;font-weight:bold;cursor:pointer}
h1{color:white;letter-spacing:3px}
</style>
</head>
<body>
<div class="bg"></div>
<div class="login">
  <div class="box">
    <h1>PO80.COM</h1>
    <input id="user" type="text" placeholder="Usuario">
    <input id="pass" type="password" placeholder="Contraseña">
    <button onclick="entrar()">ENTRAR</button>
  </div>
</div>
<script>
function entrar(){
  let u=document.getElementById('user').value.trim();
  let p=document.getElementById('pass').value.trim();
  if(u===atob('MTk3MQ==') && p===atob('MTk3MQ==')){
    localStorage.setItem('po80_auth','ok');
    location.href='/home.html';
  }else alert('Datos incorrectos');
}
</script>
</body>
</html>
