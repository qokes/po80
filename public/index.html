<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PO80.COM — PRIVATE BY LENOX JG</title><script src="https://cdn.tailwindcss.com"></script><link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@300;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet"><style>*{font-family:'Bricolage Grotesque',sans-serif}.serif{font-family:'Instrument Serif',serif}body{background:#070707;color:#f5f5f5}.img{position:fixed;inset:0;z-index:-2;background:url('https://images.unsplash.com/photo-1506905925346-21bda4d32df4?q=80&w=2000') center/cover}.blur{position:fixed;inset:0;z-index:-1;background:radial-gradient(80% 60% at 50% 0%, rgba(255,255,255,0.07), transparent 60%), linear-gradient(to bottom, rgba(0,0,0,0.15), rgba(0,0,0,0.92) 75%, #070707)}.card{background:rgba(255,255,255,0.06);backdrop-filter:blur(40px);border:1px solid rgba(255,255,255,0.09)}#lockScreen{position:fixed;inset:0;z-index:9999;background:#070707;display:flex;align-items:center;justify-content:center;padding:24px}#main{display:none}</style></head><body><div class="img"></div><div class="blur"></div>

<div id="lockScreen">
<div class="card rounded-[32px] p-10 max-w-[400px] w-full text-center">
<p class="text-[10px] tracking-[0.5em] opacity-30">PO80.COM — PRIVATE</p>
<h2 class="serif text-[36px] mt-4 leading-[0.9]">Solo<br><span class="italic opacity-40">fundador</span></h2>
<p class="text-[11px] opacity-40 mt-3">Sistema en creación por LENOX JG</p>
<input id="user" placeholder="Usuario" class="mt-8 w-full bg-white/[0.06] border border-white/10 rounded-full px-5 py-3 text-[12px] outline-none text-center">
<input id="pass" type="password" placeholder="Contraseña" class="mt-3 w-full bg-white/[0.06] border border-white/10 rounded-full px-5 py-3 text-[12px] outline-none text-center">
<button onclick="login()" class="mt-5 w-full bg-white text-black py-4 rounded-full text-[11px] tracking-[0.2em] font-bold">ENTRAR</button>
<p id="err" class="text-[10px] text-red-400 mt-3 hidden">Incorrecto</p>
</div>
</div>

<div id="main" class="max-w-[1200px] mx-auto px-6 md:px-10 pt-8 pb-24">
<div class="flex justify-between"><p class="text-[12px] tracking-[0.5em]">PO80.COM</p><button onclick="logout()" class="card rounded-full px-5 py-2 text-[10px] opacity-60">CERRAR SESIÓN</button></div>
<h1 class="serif text-[18vw] md:text-[110px] leading-[0.85] mt-16">Sistema<br><span class="italic opacity-40">privado</span></h1>
<p class="mt-6 opacity-60">Contraseña actualizada: 197126 — Solo tú entras LENOX</p>
<div class="mt-8 card rounded-[28px] p-8"><p>Ya tu sistema está protegido. Nadie lo ve sin usuario <b>lenox</b> y clave <b>197126</b></p></div>
</div>

<script>
function login(){let u=document.getElementById('user').value.toLowerCase();let p=document.getElementById('pass').value;if(u==='lenox'&&p==='197126'){localStorage.setItem('po80_auth','1');document.getElementById('lockScreen').style.display='none';document.getElementById('main').style.display='block';}else{document.getElementById('err').style.display='block';}}
function logout(){localStorage.removeItem('po80_auth');location.reload();}
if(localStorage.getItem('po80_auth')==='1'){document.getElementById('lockScreen').style.display='none';document.getElementById('main').style.display='block';}
</script>
</body></html>
