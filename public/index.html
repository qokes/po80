<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>PO80 — Personal Connectivity System</title>
  <meta name="description" content="PO80 is a personal connectivity platform designed to store, manage and access previously available connectivity resources.">
  <meta name="theme-color" content="#05070b">

  <style>
    :root {
      --bg: #05070b;
      --bg2: #090d14;
      --panel: rgba(255,255,255,.055);
      --panel2: rgba(255,255,255,.035);
      --border: rgba(255,255,255,.10);
      --text: #f5f7fb;
      --muted: #9aa5b5;
      --accent: #69f0ae;
      --accent2: #43d9ff;
      --danger: #ff667d;
      --max: 1180px;
      --radius: 24px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 15% 10%, rgba(67,217,255,.10), transparent 30%),
        radial-gradient(circle at 85% 20%, rgba(105,240,174,.08), transparent 28%),
        var(--bg);
      color: var(--text);
      line-height: 1.6;
      overflow-x: hidden;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button {
      font: inherit;
    }

    .container {
      width: min(var(--max), calc(100% - 40px));
      margin: auto;
    }

    /* NAVIGATION */

    nav {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 1000;
      backdrop-filter: blur(18px);
      background: rgba(5,7,11,.72);
      border-bottom: 1px solid rgba(255,255,255,.06);
    }

    .nav-inner {
      height: 76px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 30px;
    }

    .logo {
      font-size: 25px;
      font-weight: 900;
      letter-spacing: -1.5px;
    }

    .logo span {
      color: var(--accent);
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 28px;
      color: #cbd3df;
      font-size: 14px;
    }

    .nav-links a:hover {
      color: white;
    }

    .language {
      border: 1px solid var(--border);
      background: var(--panel);
      color: white;
      border-radius: 10px;
      padding: 9px 12px;
      cursor: pointer;
    }

    /* HERO */

    .hero {
      min-height: 100vh;
      padding: 150px 0 90px;
      display: flex;
      align-items: center;
      position: relative;
    }

    .hero-grid {
      display: grid;
      grid-template-columns: 1.1fr .9fr;
      gap: 70px;
      align-items: center;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      border: 1px solid rgba(105,240,174,.22);
      background: rgba(105,240,174,.07);
      color: var(--accent);
      padding: 8px 13px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .8px;
      margin-bottom: 24px;
    }

    .dot {
      width: 7px;
      height: 7px;
      background: var(--accent);
      border-radius: 50%;
      box-shadow: 0 0 14px var(--accent);
    }

    h1 {
      font-size: clamp(54px, 7vw, 94px);
      line-height: .94;
      letter-spacing: -5px;
      max-width: 760px;
      margin-bottom: 28px;
    }

    h1 .gradient {
      background: linear-gradient(100deg, #fff, #8df5c1, #62dcff);
      -webkit-background-clip: text;
      color: transparent;
    }

    .hero-description {
      max-width: 650px;
      color: var(--muted);
      font-size: 18px;
      margin-bottom: 34px;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 13px;
    }

    .btn {
      display: inline-flex;
      justify-content: center;
      align-items: center;
      min-height: 50px;
      padding: 0 21px;
      border-radius: 13px;
      border: 1px solid var(--border);
      cursor: pointer;
      transition: .25s ease;
      font-weight: 800;
    }

    .btn-primary {
      background: var(--accent);
      color: #04100a;
      border-color: var(--accent);
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 35px rgba(105,240,174,.18);
    }

    .btn-secondary {
      background: var(--panel);
      color: white;
    }

    .btn-secondary:hover {
      background: rgba(255,255,255,.09);
      transform: translateY(-2px);
    }

    /* DEVICE */

    .device-wrap {
      position: relative;
      display: flex;
      justify-content: center;
    }

    .device {
      width: min(360px, 100%);
      aspect-ratio: 9 / 18;
      border: 1px solid rgba(255,255,255,.18);
      border-radius: 42px;
      padding: 12px;
      background: linear-gradient(145deg, #161c25, #05070b);
      box-shadow:
        0 50px 100px rgba(0,0,0,.5),
        0 0 80px rgba(67,217,255,.08);
      transform: rotate(2deg);
    }

    .screen {
      width: 100%;
      height: 100%;
      border-radius: 31px;
      background:
        radial-gradient(circle at 50% 20%, rgba(105,240,174,.15), transparent 30%),
        #070a10;
      padding: 25px;
      display: flex;
      flex-direction: column;
    }

    .screen-top {
      display: flex;
      justify-content: space-between;
      color: #8591a3;
      font-size: 11px;
      margin-bottom: 35px;
    }

    .po80-big {
      font-size: 52px;
      font-weight: 900;
      letter-spacing: -4px;
    }

    .online {
      color: var(--accent);
      font-size: 12px;
      font-weight: 800;
      margin-bottom: 35px;
    }

    .storage {
      border: 1px solid var(--border);
      background: var(--panel);
      border-radius: 20px;
      padding: 20px;
      margin-bottom: 20px;
    }

    .storage-title {
      color: var(--muted);
      font-size: 12px;
    }

    .storage-number {
      font-size: 38px;
      font-weight: 900;
      margin: 3px 0 12px;
    }

    .progress {
      height: 6px;
      border-radius: 20px;
      background: #171e28;
      overflow: hidden;
    }

    .progress span {
      display: block;
      width: 62%;
      height: 100%;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
    }

    .phone-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: auto;
    }

    .phone-button {
      border: 1px solid var(--border);
      background: var(--panel);
      border-radius: 14px;
      padding: 14px 5px;
      text-align: center;
      font-size: 11px;
      font-weight: 800;
    }

    /* STATUS */

    .status-bar {
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      background: rgba(255,255,255,.025);
    }

    .status-inner {
      min-height: 80px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      flex-wrap: wrap;
    }

    .status-item {
      display: flex;
      align-items: center;
      gap: 10px;
      color: #b9c2cf;
      font-size: 13px;
    }

    .status-green {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
    }

    /* SECTIONS */

    section {
      padding: 110px 0;
    }

    .section-heading {
      max-width: 700px;
      margin-bottom: 55px;
    }

    .section-heading h2 {
      font-size: clamp(34px, 5vw, 58px);
      line-height: 1;
      letter-spacing: -3px;
      margin-bottom: 18px;
    }

    .section-heading p {
      color: var(--muted);
      font-size: 17px;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
    }

    .card {
      background: var(--panel2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 30px;
      transition: .3s ease;
    }

    .card:hover {
      transform: translateY(-5px);
      background: rgba(255,255,255,.06);
      border-color: rgba(105,240,174,.22);
    }

    .icon {
      width: 46px;
      height: 46px;
      border-radius: 14px;
      display: grid;
      place-items: center;
      background: rgba(105,240,174,.09);
      border: 1px solid rgba(105,240,174,.16);
      color: var(--accent);
      font-size: 20px;
      margin-bottom: 25px;
    }

    .card h3 {
      font-size: 20px;
      margin-bottom: 10px;
    }

    .card p {
      color: var(--muted);
      font-size: 14px;
    }

    /* HOW IT WORKS */

    .steps {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 15px;
    }

    .step {
      border-top: 1px solid var(--border);
      padding-top: 25px;
    }

    .step-number {
      color: var(--accent);
      font-weight: 900;
      font-size: 13px;
      margin-bottom: 20px;
    }

    .step h3 {
      margin-bottom: 9px;
    }

    .step p {
      color: var(--muted);
      font-size: 14px;
    }

    /* DASHBOARD */

    .dashboard {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
    }

    .dashboard-card {
      border: 1px solid var(--border);
      background: var(--panel2);
      border-radius: var(--radius);
      padding: 32px;
    }

    .dashboard-card.large {
      min-height: 310px;
    }

    .metric {
      font-size: 58px;
      font-weight: 900;
      letter-spacing: -3px;
      margin: 15px 0;
    }

    .metric small {
      font-size: 18px;
      color: var(--muted);
      letter-spacing: 0;
    }

    .mini-list {
      list-style: none;
      margin-top: 25px;
    }

    .mini-list li {
      padding: 12px 0;
      border-bottom: 1px solid rgba(255,255,255,.06);
      color: #bbc4d1;
      font-size: 13px;
    }

    /* PLANS */

    .plans {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
      max-width: 850px;
    }

    .plan {
      position: relative;
      border: 1px solid var(--border);
      background: var(--panel2);
      border-radius: 26px;
      padding: 34px;
    }

    .plan.featured {
      border-color: rgba(105,240,174,.38);
      box-shadow: 0 0 60px rgba(105,240,174,.05);
    }

    .badge {
      position: absolute;
      right: 20px;
      top: 20px;
      font-size: 10px;
      color: #031008;
      background: var(--accent);
      padding: 6px 9px;
      border-radius: 999px;
      font-weight: 900;
    }

    .plan h3 {
      font-size: 24px;
      margin-bottom: 8px;
    }

    .price {
      font-size: 42px;
      font-weight: 900;
      margin: 20px 0;
    }

    .price span {
      color: var(--muted);
      font-size: 13px;
      font-weight: 500;
    }

    .plan ul {
      list-style: none;
      color: #b5bfcc;
      font-size: 14px;
      margin: 20px 0 28px;
    }

    .plan li {
      padding: 7px 0;
    }

    /* SECURITY */

    .security {
      border: 1px solid var(--border);
      background:
        linear-gradient(135deg, rgba(67,217,255,.06), rgba(105,240,174,.035)),
        var(--panel2);
      border-radius: 30px;
      padding: 45px;
    }

    .security-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 50px;
      align-items: center;
    }

    .security h2 {
      font-size: 42px;
      line-height: 1;
      letter-spacing: -2px;
      margin-bottom: 18px;
    }

    .security p {
      color: var(--muted);
    }

    .security-points {
      display: grid;
      gap: 12px;
    }

    .security-point {
      border: 1px solid var(--border);
      background: rgba(0,0,0,.14);
      padding: 16px;
      border-radius: 14px;
      font-size: 13px;
      color: #c5cdd8;
    }

    /* FOUNDER */

    .founder {
      display: grid;
      grid-template-columns: .8fr 1.2fr;
      gap: 40px;
      align-items: center;
    }

    .founder-box {
      border: 1px solid var(--border);
      background: var(--panel2);
      border-radius: 28px;
      padding: 35px;
    }

    .founder-name {
      font-size: 32px;
      font-weight: 900;
      margin-bottom: 5px;
    }

    .founder-location {
      color: var(--accent);
      font-size: 13px;
      margin-bottom: 20px;
    }

    .founder p {
      color: var(--muted);
    }

    /* CTA */

    .cta {
      text-align: center;
      padding: 120px 20px;
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
    }

    .cta h2 {
      font-size: clamp(40px, 6vw, 70px);
      letter-spacing: -4px;
      line-height: .95;
      margin-bottom: 20px;
    }

    .cta p {
      color: var(--muted);
      max-width: 620px;
      margin: 0 auto 30px;
    }

    /* FOOTER */

    footer {
      padding: 45px 0;
    }

    .footer-inner {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 30px;
      flex-wrap: wrap;
    }

    .footer-copy {
      color: #697483;
      font-size: 12px;
    }

    .footer-links {
      display: flex;
      gap: 22px;
      color: #8e99a9;
      font-size: 12px;
    }

    /* MOBILE */

    @media (max-width: 900px) {

      .nav-links {
        display: none;
      }

      .hero-grid,
      .security-grid,
      .founder,
      .dashboard {
        grid-template-columns: 1fr;
      }

      .hero {
        padding-top: 125px;
      }

      .device-wrap {
        margin-top: 20px;
      }

      .cards {
        grid-template-columns: 1fr;
      }

      .steps {
        grid-template-columns: 1fr 1fr;
      }

      .plans {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 560px) {

      .container {
        width: min(100% - 28px, var(--max));
      }

      h1 {
        letter-spacing: -3px;
      }

      section {
        padding: 80px 0;
      }

      .actions {
        flex-direction: column;
      }

      .btn {
        width: 100%;
      }

      .steps {
        grid-template-columns: 1fr;
      }

      .security {
        padding: 28px;
      }

      .status-inner {
        padding: 15px 0;
      }
    }
  </style>
</head>

  <nav>

      </div>

      <select class="language" id="language">

            </a>

          </div>

        </div>
